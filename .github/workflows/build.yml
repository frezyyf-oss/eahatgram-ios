name: Build eahatgram

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install Bazelisk
        run: |
          brew install bazelisk
          echo "USE_BAZEL_VERSION=8.4.2" >> "$GITHUB_ENV"

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'build-system/**/*.bzl', 'build-system/**/*.py') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Setup codesigning SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CODESIGNING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        env:
          CODESIGNING_SSH_KEY: ${{ secrets.CODESIGNING_SSH_KEY }}

      - name: Build debug_sim_arm64
        env:
          TELEGRAM_CODESIGNING_GIT_PASSWORD: ${{ secrets.CODESIGNING_GIT_PASSWORD }}
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --continueOnError \
            --configurationPath build-system/appstore-configuration.json \
            --gitCodesigningRepository "${{ secrets.CODESIGNING_REPO }}" \
            --gitCodesigningType development \
            --gitCodesigningUseCurrent \
            --buildNumber="${{ github.run_number }}" \
            --configuration=debug_sim_arm64

      - name: Locate IPA
        id: find_ipa
        run: |
          IPA=$(find -L bazel-bin -name "Telegram.ipa" -type f | head -1)
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Found: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: eahatgram-sim-${{ github.run_number }}
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          if-no-files-found: warn
          retention-days: 14
