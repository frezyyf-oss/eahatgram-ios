name: Build eahatgram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout eahat changes
        uses: actions/checkout@v4
        with:
          path: eahat-changes
          submodules: false

      - name: Clone Telegram-iOS with submodules
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios

      - name: Apply eahatgram modifications
        run: |
          SRC=eahat-changes
          DST=telegram-ios

          # New files
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramStats.swift"            "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramController.swift"       "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramStatsController.swift"  "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramVisualController.swift" "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramNFTController.swift"    "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramRatingController.swift" "$DST/submodules/SettingsUI/Sources/"

          # Config with API 2040
          cp "$SRC/build-system/appstore-configuration.json" "$DST/build-system/"

          # Modified files
          cp "$SRC/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift" \
             "$DST/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/"
          cp "$SRC/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift" \
             "$DST/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/"
          cp "$SRC/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreenSettingsActions.swift" \
             "$DST/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/"
          cp "$SRC/submodules/TelegramUI/Sources/ChatController.swift" \
             "$DST/submodules/TelegramUI/Sources/"

      - name: Select Xcode
        run: |
          # Find latest available Xcode that matches project requirement (26.x preferred, 16.x fallback)
          XCODE=$(ls /Applications/ | grep -E '^Xcode_26' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls /Applications/ | grep -E '^Xcode_' | sort -V | tail -1)
          fi
          echo "Using: $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('telegram-ios/WORKSPACE') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Create fake CMS-signed provisioning profiles
        run: |
          # Build a minimal provisioning profile plist
          cat > /tmp/profile.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>AppIDName</key><string>eahat</string>
            <key>ApplicationIdentifierPrefix</key><array><string>C67CF9S4VU</string></array>
            <key>TeamIdentifier</key><array><string>C67CF9S4VU</string></array>
            <key>Platform</key><array><string>iOS</string></array>
            <key>IsXcodeManaged</key><true/>
            <key>Name</key><string>eahat dev</string>
            <key>UUID</key><string>EAHAT000-0000-0000-0000-000000000001</string>
            <key>Version</key><integer>1</integer>
            <key>TimeToLive</key><integer>365</integer>
            <key>CreationDate</key><date>2026-01-01T00:00:00Z</date>
            <key>ExpirationDate</key><date>2027-12-31T00:00:00Z</date>
            <key>DeveloperCertificates</key><array></array>
            <key>Entitlements</key><dict>
              <key>application-identifier</key><string>C67CF9S4VU.ph.telegra.Telegraph</string>
              <key>keychain-access-groups</key><array><string>C67CF9S4VU.*</string></array>
              <key>get-task-allow</key><true/>
              <key>aps-environment</key><string>development</string>
            </dict>
          </dict></plist>
          PLIST

          # Self-signed cert for CMS signing
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/cms_key.pem -out /tmp/cms_cert.pem \
            -days 365 -nodes \
            -subj "/CN=eahat profile/O=eahat/C=US" 2>/dev/null

          # Trust it so security cms -D can decode later
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain /tmp/cms_cert.pem

          # Import into a temp keychain so security cms -S can sign
          security create-keychain -p "" /tmp/eahat.keychain 2>/dev/null || true
          security unlock-keychain -p "" /tmp/eahat.keychain
          openssl pkcs12 -export \
            -inkey /tmp/cms_key.pem -in /tmp/cms_cert.pem \
            -out /tmp/cms.p12 -passout pass:"" 2>/dev/null
          security import /tmp/cms.p12 -P "" -k /tmp/eahat.keychain \
            -T /usr/bin/security 2>/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "" /tmp/eahat.keychain 2>/dev/null || true
          security list-keychains -d user -s /tmp/eahat.keychain $(security list-keychains -d user | tr -d '"')

          # Sign the plist as CMS DER → fake.mobileprovision
          security cms -S -N "eahat profile" -k /tmp/eahat.keychain \
            -i /tmp/profile.plist -o /tmp/fake.mobileprovision
          echo "Profile size: $(wc -c < /tmp/fake.mobileprovision) bytes"

          # Quick decode test
          security cms -D -i /tmp/fake.mobileprovision | grep -q "eahat" && echo "decode OK"

      - name: Patch BuildConfiguration.py to copy CMS profiles
        working-directory: telegram-ios
        run: |
          python3 - << 'PYEOF'
          path = 'build-system/Make/BuildConfiguration.py'
          src = open(path).read()
          old_fn = '    def copy_profiles_to_destination(self, destination_path):\n        pass'
          new_fn = (
              '    def copy_profiles_to_destination(self, destination_path):\n'
              '        import os as _os, shutil as _sh\n'
              '        _os.makedirs(destination_path, exist_ok=True)\n'
              '        for _n in ["Telegram","Share","NotificationService","NotificationContent","Widget","BroadcastUpload","Intents"]:\n'
              '            _sh.copy("/tmp/fake.mobileprovision", _os.path.join(destination_path, _n + ".mobileprovision"))'
          )
          assert old_fn in src, 'Pattern not found'
          open(path, 'w').write(src.replace(old_fn, new_fn))
          print('Patched BuildConfiguration.py')
          PYEOF

      - name: Build debug_arm64
        working-directory: telegram-ios
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --continueOnError \
            --configurationPath build-system/appstore-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber="${{ github.run_number }}" \
            --configuration=debug_arm64

      - name: Re-sign IPA with ad-hoc for TrollStore
        working-directory: telegram-ios
        run: |
          IPA="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA" ]; then
            echo "IPA not found, skipping re-sign"
            exit 0
          fi
          WORK=$(mktemp -d)
          cp "$IPA" "$WORK/orig.ipa"
          cd "$WORK"
          unzip -q orig.ipa
          # Re-sign all bundles from innermost outward
          find Payload -name "*.dylib" -o -name "*.framework" | sort -r | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          find Payload -name "*.appex" | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          codesign --force --sign - Payload/*.app 2>/dev/null || true
          zip -qr "$GITHUB_WORKSPACE/telegram-ios/eahatgram-device.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: eahatgram-device-${{ github.run_number }}
          path: telegram-ios/eahatgram-device.ipa
          if-no-files-found: warn
          retention-days: 14
