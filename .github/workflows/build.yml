name: Build eahatgram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout eahat changes
        uses: actions/checkout@v4
        with:
          path: eahat-changes
          submodules: false

      - name: Clone Telegram-iOS with submodules
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios

      - name: Apply eahatgram modifications
        run: |
          SRC=eahat-changes
          DST=telegram-ios

          cp "$SRC/submodules/SettingsUI/Sources/EahatGramStats.swift"            "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramController.swift"       "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramStatsController.swift"  "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramVisualController.swift" "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramNFTController.swift"    "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/submodules/SettingsUI/Sources/EahatGramRatingController.swift" "$DST/submodules/SettingsUI/Sources/"
          cp "$SRC/build-system/appstore-configuration.json"                      "$DST/build-system/"
          cp "$SRC/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift" \
             "$DST/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/"
          cp "$SRC/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift" \
             "$DST/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/"
          cp "$SRC/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreenSettingsActions.swift" \
             "$DST/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/"
          cp "$SRC/submodules/TelegramUI/Sources/ChatController.swift" \
             "$DST/submodules/TelegramUI/Sources/"

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications/ | grep -E '^Xcode_26' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls /Applications/ | grep -E '^Xcode_' | sort -V | tail -1)
          fi
          echo "Using: $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('telegram-ios/WORKSPACE') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Set up signing identity from fake-codesigning certs
        working-directory: telegram-ios
        run: |
          # Import Telegram's repo-committed fake cert into a system-domain keychain
          # so codesign finds it inside Bazel's stripped-HOME exec environment.
          KPASS="eahat-build-2024"
          sudo security delete-keychain /Library/Keychains/eahat.keychain-db 2>/dev/null || true
          sudo security create-keychain -p "$KPASS" /Library/Keychains/eahat.keychain-db
          sudo security unlock-keychain -p "$KPASS" /Library/Keychains/eahat.keychain-db

          # SelfSigned.p12 uses an empty password (Telegram's convention)
          sudo security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -P '' \
            -k /Library/Keychains/eahat.keychain-db \
            -T /usr/bin/codesign -T /usr/bin/security
          sudo security import build-system/fake-codesigning/certs/Public.cer \
            -k /Library/Keychains/eahat.keychain-db
          sudo security import build-system/AppleWWDRCAG3.cer \
            -k /Library/Keychains/eahat.keychain-db 2>/dev/null || true

          sudo security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KPASS" /Library/Keychains/eahat.keychain-db
          sudo security list-keychains -d system \
            -s /Library/Keychains/System.keychain \
               /Library/Keychains/eahat.keychain-db

          echo "=== Code-signing identities visible to codesign ==="
          security find-identity -v -p codesigning

      - name: Build debug_arm64
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --continueOnError \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --buildNumber="${{ github.run_number }}" \
            --configuration=debug_arm64

      - name: Re-sign IPA for TrollStore
        working-directory: telegram-ios
        run: |
          IPA="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA" ]; then
            echo "IPA not found — listing bazel-bin/Telegram:"
            ls bazel-bin/Telegram/ 2>/dev/null || true
            exit 1
          fi

          # Full entitlements matching fake-codesigning/profiles/Telegram.mobileprovision.
          # com.apple.security.application-groups is required — without it Telegram
          # cannot open its shared database container and shows a black screen on launch.
          # com.apple.developer.team-identifier is required for keychain access on iOS 17+.
          cat > /tmp/ents.plist << 'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>C67CF9S4VU.ph.telegra.Telegraph</string>
            <key>com.apple.developer.team-identifier</key><string>C67CF9S4VU</string>
            <key>keychain-access-groups</key><array>
              <string>C67CF9S4VU.*</string>
              <string>com.apple.token</string>
            </array>
            <key>com.apple.security.application-groups</key><array>
              <string>group.ph.telegra.Telegraph</string>
            </array>
            <key>get-task-allow</key><true/>
            <key>aps-environment</key><string>development</string>
            <key>com.apple.developer.pushkit.unrestricted-voip</key><true/>
            <key>com.apple.developer.siri</key><true/>
            <key>com.apple.developer.associated-domains</key><string>*</string>
            <key>com.apple.developer.icloud-container-identifiers</key><array>
              <string>iCloud.ph.telegra.Telegraph</string>
            </array>
            <key>com.apple.developer.icloud-services</key><string>*</string>
            <key>com.apple.developer.ubiquity-container-identifiers</key><array>
              <string>iCloud.ph.telegra.Telegraph</string>
            </array>
            <key>com.apple.developer.ubiquity-kvstore-identifier</key><string>C67CF9S4VU.*</string>
            <key>com.apple.developer.usernotifications.communication</key><true/>
            <key>com.apple.developer.usernotifications.filtering</key><true/>
          </dict></plist>
          ENT

          WORK=$(mktemp -d)
          cp "$IPA" "$WORK/orig.ipa"
          cd "$WORK"
          unzip -q orig.ipa

          # Re-sign inner-to-outer: dylibs → frameworks → extensions → main app
          find Payload -name "*.dylib" | sort -r | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          find Payload -type d -name "*.framework" | sort -r | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          find Payload -type d -name "*.appex" | sort -r | while read f; do
            codesign --force --sign - --entitlements /tmp/ents.plist "$f" 2>/dev/null || true
          done
          codesign --force --sign - --entitlements /tmp/ents.plist Payload/*.app

          zip -qr "$GITHUB_WORKSPACE/telegram-ios/eahatgram-device.ipa" Payload
          echo "IPA ready: $(du -sh "$GITHUB_WORKSPACE/telegram-ios/eahatgram-device.ipa")"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: eahatgram-device-${{ github.run_number }}
          path: telegram-ios/eahatgram-device.ipa
          if-no-files-found: error
          retention-days: 14
